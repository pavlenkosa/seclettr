server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/plain text/css application/javascript application/json
        application/wasm image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_comp_level 6;

    server_tokens off;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), speaker-selection=(self), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # CSP is also set in index.html <meta> for defence-in-depth;
    # the HTTP header additionally enforces frame-ancestors which <meta> cannot.
    # style-src 'unsafe-inline' is required by CSS Modules runtime injection.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self';" always;
    # HSTS: enable only when TLS is terminated by this container directly.
    # In production this container sits behind the infra nginx which handles TLS
    # and sets HSTS with includeSubDomains + preload. Uncomment the line below
    # only if this container is the TLS endpoint.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Static assets — immutable, 1 year ─────────────────────────────────────
    # Vite output: all JS/CSS/WASM files have content-hash in filenames.
    location = /runtime-config.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(?:js|css|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-apply security headers (add_header doesn't inherit in nested blocks).
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(?:woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── PWA manifest / service workers — always revalidate ────────────────────
    location ~* \.(?:webmanifest|json)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # All non-file routes serve index.html so React Router handles navigation.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must revalidate on every request.
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self';" always;
        }
    }
}
