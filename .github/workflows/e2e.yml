# Blocking E2E workflow (audit F7 graduation). Both suites proven green locally
# on 2026-09-27 against a live stack (SFU bootstrap + 4 chromium e2e); now blocking.
# P0-2: this workflow is a release-candidate gate. It runs on every push to
# dev/main and on pull requests (excluding docs-only changes), on a nightly
# schedule for broader validation, and manually via workflow_dispatch.
name: E2E

on:
  push:
    branches:
      - dev/main
      - main
    paths-ignore:
      - 'README.md'
      - 'AUDIT.md'
      - 'DEPLOYMENT.md'
      - 'LEGAL_NOTICE.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/**/*.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AUDIT.md'
      - 'DEPLOYMENT.md'
      - 'LEGAL_NOTICE.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/**/*.md'
      - '**/*.md'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-chromium:
    name: E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Playwright config and @playwright/test live at the repo root (the
      # e2e-smoke script runs `pnpm exec playwright test` from the root), so the
      # browser install must use the same resolved binary from the root too.
      # Without this, chromium.launch() fails in global-setup with no artifacts.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke suite (chromium)
        run: bash scripts/ops/e2e-smoke.sh -- --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  external-sfu-integration:
    name: External SFU integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start dev stack
        run: bash scripts/dev/up.sh

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3301/health >/dev/null 2>&1; then
              echo "API healthy"
              exit 0
            fi
            echo "waiting for API ($i/60)"
            sleep 3
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Run external SFU integration tests
        env:
          QM_API_INCLUDE_EXTERNAL_SFU_TESTS: "1"
          API_URL: http://127.0.0.1:3301
          SFU_URL: http://127.0.0.1:3302
        run: pnpm --filter @seclettr/api test:integration:external

      - name: Tear down dev stack
        if: always()
        run: bash scripts/dev/down.sh
