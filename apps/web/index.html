<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b1526" />
    <meta name="description" content="Seclettr - end-to-end encrypted messaging" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        form-action 'self';
        object-src 'none';
        frame-src 'none';
        script-src 'self' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https: https://*.giphy.com https://*.giphy.com.cdn.cloudflare.net https://media.giphy.com;
        font-src 'self' data:;
        connect-src 'self' http: https: ws: wss:;
        media-src 'self' blob: data: https:;
        worker-src 'self' blob:;
        manifest-src 'self';
      "
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Seclettr" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="referrer" content="no-referrer" />
    <title>Seclettr</title>
    <!--
      Immediate first-paint background that matches the dark default and
      flips to light when the system prefers it. The theme-preboot.js script
      below refines this with the user's saved preference from localStorage.
    -->
    <style>
      body { background: #0b1526; }
      @media (prefers-color-scheme: light) { body { background: #eef3fa; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Synchronous: applies data-theme/data-accent from localStorage before React mounts. -->
    <script src="/theme-preboot.js"></script>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
