name: Dev Bundle

on:
  workflow_run:
    workflows:
      - Dev CI
    types:
      - completed
    branches:
      - dev/main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "dev/main"

permissions:
  contents: write
  packages: write

concurrency:
  group: dev-bundle-dev-main
  cancel-in-progress: true

jobs:
  build-dev-bundle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare metadata
        id: meta
        shell: bash
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${COMMIT_SHA:0:12}"
          IMAGE_TAG="dev-${SHORT_SHA}"
          BUNDLE_PREFIX="seclettr-dev-main"
          GHCR_REGISTRY="ghcr.io"
          GHCR_NAMESPACE="${{ github.repository }}"
          APP_VERSION="$(node -e "console.log(require('./package.json').version)")"

          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "bundle_prefix=${BUNDLE_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "ghcr_registry=${GHCR_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "ghcr_namespace=${GHCR_NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "api_image=${GHCR_REGISTRY}/${GHCR_NAMESPACE}/api" >> "$GITHUB_OUTPUT"
          echo "web_image=${GHCR_REGISTRY}/${GHCR_NAMESPACE}/web" >> "$GITHUB_OUTPUT"
          echo "sfu_image=${GHCR_REGISTRY}/${GHCR_NAMESPACE}/sfu" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

          git log -1 --format='%s' HEAD > /tmp/commit-subject.txt
          git log -1 --format='%b' HEAD > /tmp/commit-body.txt

          {
            echo 'commit_subject<<__EOF__'
            cat /tmp/commit-subject.txt
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            SECLETTR_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_REVISION=${{ steps.meta.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ github.event.workflow_run.created_at || github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            SECLETTR_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_REVISION=${{ steps.meta.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ github.event.workflow_run.created_at || github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push SFU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/sfu/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.sfu_image }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            SECLETTR_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_REVISION=${{ steps.meta.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ github.event.workflow_run.created_at || github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dev bundle
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            pnpm release:build -- \
              --name "${{ steps.meta.outputs.bundle_prefix }}" \
              --tag  "${{ steps.meta.outputs.image_tag }}" \
              --skip-verify
          else
            pnpm release:build -- \
              --name "${{ steps.meta.outputs.bundle_prefix }}" \
              --tag  "${{ steps.meta.outputs.image_tag }}"
          fi

      - name: Build Android debug APK
        shell: bash
        run: pnpm --filter @seclettr/web run android:build:debug

      - name: Upload artifact — Android APK
        uses: actions/upload-artifact@v4
        with:
          name: seclettr-dev-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact — dev bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.bundle_prefix }}
          path: |
            build/*.tar.gz
            build/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Send deployment dispatch
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          echo "Dev bundle ready: ${BUNDLE_PREFIX}-${IMAGE_TAG}.tar.gz"
          echo "GHCR images:"
          echo "  ghcr.io/${{ github.repository }}/api:${IMAGE_TAG}"
          echo "  ghcr.io/${{ github.repository }}/web:${IMAGE_TAG}"
          echo "  ghcr.io/${{ github.repository }}/sfu:${IMAGE_TAG}"
