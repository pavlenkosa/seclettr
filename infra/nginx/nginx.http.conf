worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 4096;
  use epoll;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  upstream api {
    server api:3001;
    keepalive 32;
  }

  upstream sfu {
    server host.docker.internal:3002;
    keepalive 16;
  }

  upstream minio {
    server minio:9000;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      expires 1y;
    }

    location /sw.js {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
    }

    location = /runtime-config.js {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
    }

    # MinIO presigned upload/download URLs are rewritten by the API to this
    # public origin. Keep the bucket path intact and pass the internal Host
    # header expected by MinIO/SigV4 validation.
    #
    # CORS: the Capacitor Android WebView runs on https://localhost so fetch()
    # calls to presigned URLs require explicit allow. Presigned URLs are
    # authenticated via SigV4 query params so broadening CORS here is safe.
    location ~ ^/(seclettr-attachments|seclettr-attachments-plain)(/|$) {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://localhost" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range, X-Amz-Date, X-Amz-Content-Sha256" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type, ETag" always;
        add_header Access-Control-Max-Age 3600 always;
        return 204;
      }
      add_header Access-Control-Allow-Origin "https://localhost" always;
      add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type, ETag" always;

      client_max_body_size 110m;
      proxy_pass http://minio;
      proxy_http_version 1.1;
      proxy_set_header Host minio:9000;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api/auth/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
      proxy_pass http://api/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    location /sfu/ {
      proxy_pass http://sfu/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
