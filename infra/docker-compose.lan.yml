services:
  coturn:
    command: >
      -n
      --lt-cred-mech
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-changeme_turn_secret}
      --realm=${TURN_DOMAIN:-localhost}
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      --min-port=${TURN_MIN_PORT:-50000}
      --max-port=${TURN_MAX_PORT:-51999}
      --log-file=stdout
      --fingerprint
