sonar.projectKey=seclettr
sonar.projectName=Seclettr
sonar.projectVersion=1.3.1-beta

sonar.sources=apps/api/src,apps/web/src,apps/sfu/src,packages/protocol/src,packages/crypto/src,scripts

sonar.tests=apps/api/src/test

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.turbo/**,\
  **/coverage/**,\
  **/*.config.*,\
  **/android/**,\
  **/gradle/**,\
  **/gradlew*,\
  **/capacitor-cordova-android-plugins/**,\
  **/generated/**,\
  **/proto/**,\
  **/protobuf/**,\
  **/__mocks__/**,\
  **/src/test/**,\
  **/*.test.*,\
  **/*.spec.*

sonar.test.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**

sonar.typescript.exclusions=**/*.d.ts

sonar.javascript.lcov.reportPaths=

sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.json,apps/sfu/tsconfig.json,packages/protocol/tsconfig.json,packages/crypto/tsconfig.json

sonar.sourceEncoding=UTF-8

sonar.javascript.node.maxspace=4096

sonar.log.level=INFO

sonar.verbose=false
